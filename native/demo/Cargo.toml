[package]
name = "emacs-egui-native-demo"
version = "0.2.0"
edition = "2021"
description = "The native backend's demo application: a frame counter, a button, a text field and an animated bar"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
emacs-egui-native = { path = ".." }
emacs-egui-sdk = { path = "../../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
