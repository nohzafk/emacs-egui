[package]
name = "emacs-egui-sdk"
version = "0.2.0"
edition = "2021"
description = "SDK for egui applications that run inside Emacs, on WebAssembly in xwidget-webkit or as a native dynamic module"
license = "MIT"
repository = "https://github.com/nohzafk/emacs-egui"
keywords = ["emacs", "egui", "wasm", "xwidget", "gui"]
categories = ["gui", "wasm"]
readme = "../README.md"

[features]
default = []
# The WebAssembly half: the eframe bootstrap, the JavaScript entry points
# `egui_push_state` and `egui_push_theme`, and the loopback fetch helpers.
web = [
    "dep:eframe",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
egui = "0.36"

eframe = { version = "0.36", default-features = false, features = ["glow"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Location",
    "UrlSearchParams",
    "Response",
] }
console_error_panic_hook = { version = "0.1", optional = true }
